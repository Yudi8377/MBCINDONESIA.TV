<main class="container watch-layout">
  <div>
    <div class="player-shell"><video id="player" controls playsinline preload="metadata" poster="assets/img/hero.jpg"></video></div>
<p id="wVideoLabel" class="muted" style="font-size:.78rem;margin:.5rem 0 0" aria-live="polite"></p>
<p id="properr" role="status" style="display:none;margin:.6rem 0 0;padding:.7rem .9rem;border-radius:10px;background:#3a1414;color:#ffd9d9;font-size:.82rem"></p>
    <div class="watch-info">
      <span class="card-cat" id="wCat"></span>
      <h1 id="wTitle" style="font-size:1.5rem;margin:.3rem 0;letter-spacing:-.01em"></h1>
      <p class="muted" id="wDesc" style="font-size:.9rem;max-width:70ch"></p>
      <div class="watch-actions">
        <button class="btn btn-red" id="likeBtn">👍 Suka · <span id="likeCount">0</span></button>
        <button class="btn btn-ghost" id="shareBtn">🔗 Salin Tautan</button>
        <button class="btn btn-ghost" id="saveBtn">＋ Simpan ke Daftar Saya</button>
      </div>
      <p class="muted" style="font-size:.7rem;margin-top:.7rem" id="wHl"></p>
    </div>

    <section style="margin-top:1.2rem">
      <h2 style="font-size:1rem;margin-bottom:.5rem">Komentar <span class="muted" id="cCount"></span></h2>
      <form id="commentForm" class="form-komentar-aman" style="display:flex;gap:.5rem;margin-bottom:.6rem">
        <input id="commentInput" placeholder="Tulis komentar…" style="flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;color:var(--text);outline:0" aria-label="Komentar">
        <button class="btn btn-red" type="submit">Kirim</button>
      </form>
      <div id="commentList"></div>
    </section>
  </div>

  <aside>
    <h2 style="font-size:1rem;margin-bottom:.2rem">Daftar Episode</h2>
    <p class="muted" style="font-size:.72rem">Pilih episode untuk langsung diputar.</p>
    <div class="ep-list" id="epList"></div>
    <h2 style="font-size:1rem;margin:1.3rem 0 .4rem">Program Serupa</h2>
    <div id="related" class="grid" style="grid-template-columns:1fr 1fr;gap:.6rem"></div>
  </aside>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
const params = new URLSearchParams(location.search);
const p = MBCDATA.getProgram(params.get('id'));
document.title = p.title + ' — MBC INDONESIA';
document.getElementById('wCat').textContent = p.cat + ' · ★ ' + p.rating + ' · ' + p.views + ' tayang';
document.getElementById('wTitle').textContent = p.title;
document.getElementById('wDesc').textContent = p.desc;
document.getElementById('wHl').textContent = p.hl + ' · © MBC Indonesia Group. Hak tayang konten tercatat di registri MAM.';

const player = document.getElementById('player');
/* Cadangan cerdas: kalau kunci video tidak dikenal, pakai klip episode pertama
   dari program yang sama — jangan pernah memutar video program lain. */
function cadangan() {
  const daftar = (p.eps || []).map(e => MBCDATA.videos[e[2]]).filter(Boolean);
  return daftar[0] || MBCDATA.videos.live || '';
}
/* Jaring aman: bila atribut src hilang / gagal, selalu jatuhkan ke klip lokal */
function mulaiPutar(url) {
  const sumber = url || cadangan();  // cadangan: klip episode pertama program ini
  player.src = sumber;
  player.load();
  player.play().catch(() => {});
}
/* Pesan jelas bila ada kendala pemutaran (bukan layar hitam tanpa penjelasan) */
const properr = document.getElementById('properr');
function tampilkanGagal(){
  if (!properr) return;
  properr.style.display = 'block';
  properr.innerHTML = '⚠️ Video tidak dapat diputar. Coba <b>muat ulang halaman</b>, atau buka lewat Chrome/Safari terbaru. ' +
    '<button class="btn btn-ghost" style="padding:.25rem .6rem;font-size:.75rem" onclick="location.reload()">Muat ulang</button>';
}
player.addEventListener('error', () => {
  if (!player.dataset.retry) { player.dataset.retry = '1'; mulaiPutar(cadangan()); return; }
  tampilkanGagal();
});
player.addEventListener('playing', () => { player.dataset.ok = '1'; if (properr) properr.style.display = 'none'; });
setTimeout(() => { if (!player.dataset.ok && player.paused) tampilkanGagal(); }, 9000);
player.poster = p.img;
function playEpisode(i){
  const [t,d,key] = p.eps[i];
  /* Klip dicari lewat kunci; bila kunci dari API belum punya berkas, pakai klip
     program ini yang memang tersedia (bukan video program lain). */
  const url = MBCDATA.videos[key] || cadangan();
  if (!MBCDATA.videos[key]) console.warn('[MBC] klip untuk "' + t + '" belum tersedia (kunci: ' + key + ') — memakai klip program ini.');
  mulaiPutar(url);
  document.getElementById('wTitle').textContent = p.title + ' — ' + t;
  const lbl = document.getElementById('wVideoLabel'); if (lbl) lbl.textContent = 'Sedang diputar: ' + p.title + ' · ' + t;
  document.querySelectorAll('.ep').forEach((el,idx)=>el.classList.toggle('active', idx===i));
}
document.getElementById('epList').innerHTML = p.eps.map(([t,d],i)=>`
  <button class="ep" data-i="${i}"><img src="${p.img}" alt="${t}" onerror="this.onerror=null;this.src='assets/img/hero.jpg'"><span><h4>${t}</h4><small>${d} · ${p.cat}</small></span></button>`).join('');
document.getElementById('epList').addEventListener('click', e=>{
  const btn = e.target.closest('.ep'); if(btn) playEpisode(+btn.dataset.i);
});

// Suka & simpan (localStorage)
const likeKey = 'mbc_like_'+p.id, saveKey='mbc_saved';
const baseLikes = 128 + p.id.length*13;
function renderLikes(){ document.getElementById('likeCount').textContent = baseLikes + (localStorage.getItem(likeKey)?1:0); }
document.getElementById('likeBtn').addEventListener('click', ()=>{ localStorage.getItem(likeKey)?localStorage.removeItem(likeKey):localStorage.setItem(likeKey,'1'); renderLikes(); });
document.getElementById('shareBtn').addEventListener('click', async ()=>{ try{ await navigator.clipboard.writeText(location.href); toast('Tautan disalin ke papan klip.'); }catch{ toast('Salin manual: '+location.href); } });
document.getElementById('saveBtn').addEventListener('click', ()=>{ const s=JSON.parse(localStorage.getItem(saveKey)||'[]'); const i=s.indexOf(p.id); i>=0?s.splice(i,1):s.push(p.id); localStorage.setItem(saveKey,JSON.stringify(s)); toast(i>=0?'Dihapus dari Daftar Saya.':'Tersimpan di Daftar Saya.'); });
renderLikes();

// Program serupa
document.getElementById('related').innerHTML = MBCDATA.programs.filter(x=>x.id!==p.id).slice(0,4).map(cardHTML).join('');

// Komentar — server (API) saat online, localStorage saat offline
const cKey = 'mbc_comments_'+p.id;
const escH = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const relTime = iso => { try { const s=(Date.now()-new Date(iso).getTime())/1000; if(s<60) return 'Baru saja'; if(s<3600) return Math.floor(s/60)+' mnt lalu'; if(s<86400) return Math.floor(s/3600)+' jam lalu'; return Math.floor(s/86400)+' hari lalu'; } catch { return ''; } };
const seedComments = () => [{n:'Dewi Lestari',t:'Dokumenter Bromo-nya luar biasa! Ditunggu episode berikutnya.',w:'contoh lokal'},{n:'Rangga P.',t:'Kualitas gambar dan audionya sudah setara TV nasional. Bangga!',w:'contoh lokal'}];
function renderCommentsData(list){
  document.getElementById('cCount').textContent = '('+list.length+')';
  document.getElementById('commentList').innerHTML = list.length === 0
    ? '<p class="muted" style="font-size:.8rem;padding:.5rem .1rem">Belum ada komentar. Jadilah yang pertama!</p>'
    : list.map(c=>`<div class="comment"><div class="avatar">${escH(c.n.trim().charAt(0).toUpperCase())}</div><div><div style="font-size:.8rem"><b>${escH(c.n)}</b> <span class="muted" style="font-size:.68rem">· ${escH(c.w)}</span></div><div style="font-size:.85rem">${escH(c.t)}</div></div></div>`).join('');
}
async function loadComments(){
  try {
    const res = await fetch('/api/comments?program_id='+encodeURIComponent(p.id));
    if (!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    renderCommentsData((data.comments||[]).map(c=>({n:c.author, t:c.body, w:relTime(c.created_at)})));
  } catch(_) {
    renderCommentsData(JSON.parse(localStorage.getItem(cKey)||'null') || seedComments());
  }
}
document.getElementById('commentForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const input = document.getElementById('commentInput');
  const text = input.value.trim(); if(!text) return;
  let sent = false;
  try {
    const res = await fetch('/api/comments', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({program_id: p.id, author:'Anda (Pengguna)', body: text}) });
    sent = res.ok;
  } catch(_) { /* offline */ }
  if (!sent) {
    const list = JSON.parse(localStorage.getItem(cKey)||'[]');
    list.unshift({n:'Anda (Pengguna Demo)', t:text, w:'Baru saja'});
    localStorage.setItem(cKey, JSON.stringify(list));
    toast('Komentar tersimpan lokal (server tidak terjangkau).');
  } else {
    toast('Komentar terkirim & tersimpan di server.');
  }
  input.value=''; loadComments();
});
loadComments();

// SEO: VideoObject JSON-LD
try {
  const ld = document.createElement('script');
  ld.type = 'application/ld+json';
  ld.textContent = JSON.stringify({"@context":"https://schema.org","@type":"VideoObject","name":p.title,"description":p.desc,"thumbnailUrl":new URL(p.img, location.href).href,"uploadDate":"2026-11-01","inLanguage":"id","publisher":{"@type":"Organization","name":"MBC Indonesia Group"}});
  document.head.appendChild(ld);
} catch(_) {}
playEpisode(0);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
