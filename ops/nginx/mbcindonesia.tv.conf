# /etc/nginx/sites-available/mbcindonesia.tv
# Certbot: sudo certbot --nginx -d mbcindonesia.tv -d www.mbcindonesia.tv
# Aplikasi sudah mengirim gzip + header keamanan, jadi nginx hanya proxy.

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name mbcindonesia.tv www.mbcindonesia.tv;
    return 301 https://mbcindonesia.tv$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.mbcindonesia.tv;
    ssl_certificate     /etc/letsencrypt/live/mbcindonesia.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mbcindonesia.tv/privkey.pem;
    return 301 https://mbcindonesia.tv$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mbcindonesia.tv;

    ssl_certificate     /etc/letsencrypt/live/mbcindonesia.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mbcindonesia.tv/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 12m;   # unggah bukti kampanye / dokumen
    server_tokens off;

    # Aset statis dilayani aplikasi (sudah ber-cache-control). Semua di-proxy
    # agar satu sumber kebenaran & header konsisten.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Batasi laju endpoint API (login brute-force, dsb.)
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App Links & manifest tidak boleh di-cache lama
    location = /.well-known/assetlinks.json {
        proxy_pass http://127.0.0.1:8080;
        add_header Cache-Control "public, max-age=3600";
    }
}
